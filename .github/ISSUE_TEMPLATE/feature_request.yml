name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: "Do not include private documents or sensitive filenames."
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy considerations
      description: Would this change scanning, filenames, moves, cleanup or Undo?
