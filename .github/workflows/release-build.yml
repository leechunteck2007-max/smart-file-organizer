name: Build Windows alpha package
on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.2.0-alpha'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir -r requirements.txt -r requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm install --global pnpm@11.19.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --dir frontend install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node frontend/node_modules/electron/install.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Pre-build source audit
        run: python scripts/release_check.py
      - name: Tested standalone package
        run: python scripts/build_smart_portable.py
      - name: Retain package for review; never auto-publish a release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SmartFileOrganizer-v0.2.0-alpha-Windows-x64
          if-no-files-found: error
          path: |
            dist/SmartFileOrganizer-v0.2.0-alpha-Windows-x64.zip
            dist/SHA256SUMS.txt
